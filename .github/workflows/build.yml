name: 🧪 CI • Android • Desktop • Web

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  generate-cache-key:
    name: 🔑 Generate Cache Key
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.date.outputs.date }}
    steps:
      - name: Generate cache key with timestamp
        id: date
        run: echo "date=${{ runner.os }}-node-$(date +'%Y-%m-%d-%H-%m-%S')" >> $GITHUB_OUTPUT

  lint-kotlin:
    name: 🧹☕ Lint Desktop and Android Apps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 🧹 Kotlin lint (ktlint)
        run: ./gradlew ktlintCheck
  
  build-android:
    name: 🏗️🤖 Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📄 Create Environment.kt
        run: |
          cat << 'EOF' > shared/src/androidMain/kotlin/bloomy/cozyspace/config/Environment.kt
          ${{ secrets.ENV_KT }}
          EOF

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 🗲 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🏗️ Build Android
        run: ./gradlew :composeApp:assembleDebug
  
  build-desktop:
    name: 🏗️🖥️ Build Desktop App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📄 Create Environment.kt
        run: |
          cat << 'EOF' > shared/src/jvmMain/kotlin/bloomy/cozyspace/config/Environment.kt
          ${{ secrets.ENV_KT }}
          EOF

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 🏗️ Build Desktop JVM
        run: ./gradlew :composeApp:packageDistributionForCurrentOS

  setup-web:
    name: ⚙️🌐 Setup Web App
    runs-on: ubuntu-latest
    needs: generate-cache-key

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📄 Create Environment.kt
        run: |
          cat << 'EOF' > shared/src/jsMain/kotlin/bloomy/cozyspace/config/Environment.kt
          ${{ secrets.ENV_KT }}
          EOF

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 🏗️ Build shared Kotlin/JS lib
        run: ./gradlew :shared:jsBrowserDevelopmentLibraryDistribution

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ⚙️ Setup Angular
        run: npm install -g @angular/cli

      - name: 🧱 Install dependencies
        run: npm install

      - name: 📁 Cache files
        uses: actions/cache/save@v5
        with:
          path: |
            build/js
            shared/build
            node_modules
            package-lock.json
          key: ${{ needs.generate-cache-key.outputs.cache-key }}
  
  build-web:
    name: 🏗️🌐 Build Web App
    runs-on: ubuntu-latest
    needs: [generate-cache-key, setup-web]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📁 Restore cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/js
            shared/build
            node_modules
            package-lock.json
          key: ${{ needs.generate-cache-key.outputs.cache-key }}

      - name: 🏗️ Build Web
        run: npm run build

  lint-web:
    name: 🧹🌐 Lint Web App
    runs-on: ubuntu-latest
    needs: [generate-cache-key, setup-web]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📁 Restore cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/js
            shared/build
            node_modules
            package-lock.json
          key: ${{ needs.generate-cache-key.outputs.cache-key }}

      - name: 🧹 Angular lint
        run: npm run lint
