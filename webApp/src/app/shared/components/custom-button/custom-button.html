<button
    class="btn"
    [class]="'btn btn--' + variant()"
    [type]="type()"
    [disabled]="disabled() || loading()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-busy]="loading()"
>
    @if (loading()) {
        <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
    } @else if (icon()) {
        <i class="pi" [class]="icon()" aria-hidden="true"></i>
    }

    @if (label()) {
        <span>{{ label() }}</span>
    } @else {
        <ng-content />
    }
</button>
